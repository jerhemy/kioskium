name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Security problems go through **Security → Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The full command line (or kioskium.json) and, if possible, a page that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `kiosk --version`
      render: text
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which build?
      options:
        - Windows x86_64 bundle
        - Linux x86_64 bundle
        - Linux arm64 bundle
        - From source (pip install)
        - Other (own package or image)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS / distribution, board or GPU, compositor (e.g. "Yocto kirkstone, i.MX8MP, Weston 10")
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run with `--log-level debug --log-file kioskium.log` (and `--page-log` for page errors) and paste the relevant part.
      render: text
