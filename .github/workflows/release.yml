name: Release

# Every push to main: run the CI checks, let semantic-release decide whether the commits since the
# last tag warrant a release (feat -> minor, fix/perf -> patch, BREAKING CHANGE -> major), and if so
# tag it, create the GitHub Release (its notes are the changelog) and attach the three bundles.
# Nothing is committed back to main: the bundles get their version from the tag when they are built.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # A called workflow may only use permissions its caller grants, even in jobs it skips (ci.yml's
    # PR-title check asks for pull-requests: read).
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # tag, GitHub Release
      issues: write         # comment on issues fixed by the release
      pull-requests: write  # comment on released pull requests
    outputs:
      published: ${{ steps.semrel.outputs.published }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # semantic-release reads every commit since the last tag
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - id: semrel
        name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write  # gh release upload
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: v${{ needs.release.outputs.version }}
      release_tag: v${{ needs.release.outputs.version }}
