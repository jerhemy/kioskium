name: CI

on:
  pull_request:
  workflow_call:  # release.yml runs the same checks before releasing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.0
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The embedded arm64 build's stack: Python 3.9 + PySide6 6.8 (keeps the code 3.9-compatible).
          - os: ubuntu-24.04
            python: "3.9"
            install: pip install shiboken6==6.8.0.2 PySide6-Essentials==6.8.0.2 PySide6-Addons==6.8.0.2 pytest
          - os: ubuntu-24.04
            python: "3.13"
            install: pip install -r requirements/linux.txt
          - os: windows-latest
            python: "3.14"
            install: pip install -r requirements/windows.txt
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libnss3 libasound2t64 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: ${{ matrix.install }}
      - run: pip install --no-deps -e .
      - run: python -m pytest -v

  build:
    name: build bundles
    if: github.event_name == 'pull_request'
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    with:
      version: pr-${{ github.event.pull_request.number }}
